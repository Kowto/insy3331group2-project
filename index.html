<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Lemonaid helps used-car and first-time buyers look up a vehicle, explore things to inspect, and bring a checklist to a test drive.">
<title>Lemonaid | Know Before You Buy</title>
<style>
  html,body,#root{margin:0;height:100%}
  body{font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  #root > .fui-FluentProvider{height:100%}
  h1,h2,h3,h4,p,ul,ol{margin:0}
  /* Yellow fills take dark marks for contrast */
  .fui-Checkbox__input:checked ~ .fui-Checkbox__indicator{color:#241A00 !important}
  .print-only{display:none}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important;scroll-behavior:auto !important}}
  @media print{
    @page{margin:16mm}
    .screen-only,body > *:not(#root){display:none !important}
    html,body,#root,#root > .fui-FluentProvider{height:auto;background:#fff !important}
    .print-only{display:block;color:#242424;font:12pt/1.45 "Segoe UI",Arial,sans-serif}
    .print-only h1{font-size:22pt;margin:0 0 4pt;font-weight:600}
    .print-only h2{font-size:14pt;margin:18pt 0 6pt;font-weight:600;border-bottom:2pt solid #FFB900;padding-bottom:3pt}
    .print-only h3{font-size:11pt;margin:10pt 0 4pt;font-weight:600}
    .print-only .muted{color:#616161;font-size:10pt}
    .print-only .item{margin:0 0 8pt;break-inside:avoid}
    .print-only .check{margin:2pt 0}
  }
</style>
</head>
